name: Xcode Build

# Not the IPA gate. macos-14 cannot parse objectVersion 77; every push
# was a 4s red check that stole a Mac runner from Lum1na Build.
# Dispatch only. IPA is .github/workflows/build-ipa.yml (macos-15, 16.4).
on:
  workflow_dispatch:

jobs:
  build:
    name: Unsigned Release build (iphoneos)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            XCODE=/Applications/Xcode_16.4.app
          else
            XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -list -project Lum1na.xcodeproj

      - name: Build (unsigned, matches build-ipa.yml)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lum1na.xcodeproj \
            -scheme Lum1na \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build
