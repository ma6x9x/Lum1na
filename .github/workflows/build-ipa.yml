name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify source files exist
        run: |
          set -euo pipefail
          echo "=== Verifying source files ==="
          for file in Exploit/ClearSword.m Exploit/ANE.m Exploit/KASLRLeak.m Exploit/CSKRW.m Exploit/UPLLeak.m Exploit/AVERace.m Exploit/Lum1naKRW.m; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file MISSING"
            fi
          done

      - name: Add ClearSword.m to Xcode project
        run: |
          set -euo pipefail
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Lum1na.xcodeproj')
          target = project.targets.find { |t| t.name == 'Lum1na' }
          
          # Check if ClearSword.m is already in the target
          exists = target.source_build_phase.files.any? { |f| f.file_ref&.path == 'Exploit/ClearSword.m' }
          
          if exists
            puts '✓ ClearSword.m already in target'
          else
            # Find Exploit group
            exploit_group = project.main_group.groups.find { |g| g.path == 'Exploit' }
            if exploit_group.nil?
              exploit_group = project.main_group.new_group('Exploit', 'Exploit')
            end
            
            # Check if file ref exists but not in target
            file_ref = exploit_group.find_file_by_path('Exploit/ClearSword.m')
            if file_ref.nil?
              file_ref = exploit_group.new_file('Exploit/ClearSword.m')
            end
            
            target.add_file_references([file_ref])
            target.source_build_phase.add_file_reference(file_ref)
            project.save
            puts '+ Added ClearSword.m to target'
          end
          "

      - name: Show Xcode / schemes
        run: |
          set -euo pipefail
          ls -la Lum1na.xcodeproj/xcshareddata/xcschemes/
          xcodebuild -list -project Lum1na.xcodeproj

      - name: Build (unsigned, for TrollStore / SideStore resign)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lum1na.xcodeproj \
            -scheme Lum1na \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name 'Lum1na.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "Lum1na.app not found under DerivedData"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -type d -print || true
            exit 1
          fi
          echo "Using app: $APP"
          rm -rf Payload Lum1na.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Lum1na.ipa Payload
          ls -lh Lum1na.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lum1na-ipa
          path: Lum1na.ipa
          if-no-files-found: error
