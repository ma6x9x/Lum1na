on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify source files exist
        run: |
          set -euo pipefail
          echo "=== Verifying source files ==="
          
          # Objective-C implementation files
          objc_files=(
            "Exploit/ClearSword.m"
            "Exploit/ANE.m"
            "Exploit/KASLRLeak.m"
            "Exploit/CSKRW.m"
            "Exploit/UPLLeak.m"
            "Exploit/AVERace.m"
            "Exploit/Lum1naKRW.m"
            "Exploit/FusionChain.m"
            "Exploit/P009Controller.m"
            "Exploit/P052Controller.m"
            "Exploit/P039Controller.m"
            "Exploit/Momentarius.m"
            "Exploit/Persistence.m"
            "Exploit/P044AksKaslrReach.h"
            "Exploit/P035AVEWrapProbe.m"
            "Exploit/P036AVEPaintProbe.m"
            "Exploit/P037AVEPaintProbe.m"
            "Exploit/P038WHuntSmoke.m"
            "Exploit/P043WriteClassMap.m"
            "Exploit/P045HybridMap.m"
            "Exploit/P046F77PatchOracle.m"
          )
          
          # Objective-C header files (for bridging)
          header_files=(
            "Exploit/P009Controller.h"
            "Exploit/P052Controller.h"
            "Exploit/P039Controller.h"
            "Exploit/P044AksKaslrReach.h"
            "Exploit/P035AVEWrapProbe.h"
            "Exploit/P036AVEPaintProbe.h"
            "Exploit/P037AVEPaintProbe.h"
            "Exploit/P038WHuntSmoke.h"
            "Exploit/A12X_23G71_LabOffsets.h"
            "Exploit/A14_23F77_LabOffsets.h"
            "Exploit/LabDeviceProfile.h"
            "Exploit/LabLocalTime.h"
          )
          
          # Swift files
          swift_files=(
            "Exploit/Bridges/ExploitManager.swift"
          )
          
          # Bridging header
          bridging_header="Lum1na-Bridging-Header.h"
          
          echo "Checking Objective-C .m files..."
          for file in "${objc_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file MISSING"
              exit 1
            fi
          done
          
          echo "Checking Objective-C .h files..."
          for file in "${header_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file MISSING"
              exit 1
            fi
          done
          
          echo "Checking Swift files..."
          for file in "${swift_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file MISSING"
              exit 1
            fi
          done
          
          echo "Checking bridging header..."
          if [ -f "$bridging_header" ]; then
            echo "✓ $bridging_header exists"
            echo "Bridging header contents:"
            cat "$bridging_header"
          else
            echo "✗ $bridging_header MISSING"
            exit 1
          fi
          
          echo "✅ All source files verified!"
      - name: Verify iOS 18 Universal App Icon Structure
        run: |
          set -euo pipefail
          ICON_DIR="Assets.xcassets/AppIcon.appiconset"
          
          test -d "$ICON_DIR" || { echo "❌ AppIcon.appiconset missing"; exit 1; }
          test -f "$ICON_DIR/Contents.json" || { echo "❌ Contents.json missing"; exit 1; }
          
          for file in AppIcon.jpg AppIcon-Dark.jpg AppIcon-Tinted.jpg; do
            test -f "$ICON_DIR/$file" || { echo "❌ $file missing"; exit 1; }
            echo "✓ $file exists"
          done
          
          echo "✅ iOS 18 Universal App Icon structure validated!"
      - name: Fix Import Paths (cs_run.h)
        run: |
          if [ -f "Exploit/Bridges/cs_run.h" ]; then
            if grep -q '#import "Exploit/' Exploit/Bridges/cs_run.h; then
              echo "Fixing cs_run.h imports..."
              sed -i '' 's|#import "Exploit/|#import "../|g' Exploit/Bridges/cs_run.h
              echo "✅ Fixed cs_run.h"
            fi
          fi

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lum1na.xcodeproj \
            -scheme Lum1na \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            GCC_WARN_ABOUT_DUPLICATE_METHOD_NAME=NO \
            SWIFT_OBJC_BRIDGING_HEADER="Lum1na-Bridging-Header.h" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name 'Lum1na.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "❌ Lum1na.app not found"
            exit 1
          fi
          echo "✅ Found: $APP"
          rm -rf Payload Lum1na.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Lum1na.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lum1na-ipa
          path: Lum1na.ipa
          if-no-files-found: error
