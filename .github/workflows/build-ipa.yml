name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify source files exist
        run: |
          set -euo pipefail
          echo "=== Verifying source files ==="
          
          # All .m files that must exist
          files=(
            "Exploit/ClearSword.m"
            "Exploit/ANE.m"
            "Exploit/KASLRLeak.m"
            "Exploit/CSKRW.m"
            "Exploit/UPLLeak.m"
            "Exploit/AVERace.m"
            "Exploit/Lum1naKRW.m"
            "Exploit/FusionChain.m"
            "Exploit/P009Controller.m"
            "Exploit/P052Controller.m"
            "Exploit/P039Controller.m"
            "Exploit/Momentarius.m"
            "Exploit/Persistence.m"
          )
          
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file MISSING"
              exit 1
            fi
          done

      - name: Fix Xcode Project (Add all .m files to target)
        run: |
          set -euo pipefail
          gem install xcodeproj
          ruby << 'RUBY'
          require 'xcodeproj'
          
          project = Xcodeproj::Project.open('Lum1na.xcodeproj')
          target = project.targets.find { |t| t.name == 'Lum1na' }
          
          # Find or create Exploit group
          exploit_group = project.main_group.groups.find { |g| g.path == 'Exploit' }
          if exploit_group.nil?
            exploit_group = project.main_group.new_group('Exploit', 'Exploit')
            puts '+ Created Exploit group'
          end
          
          # All .m files that need to be in the target
          files_to_add = [
            'ClearSword.m',
            'ANE.m',
            'KASLRLeak.m',
            'CSKRW.m',
            'UPLLeak.m',
            'AVERace.m',
            'Lum1naKRW.m',
            'FusionChain.m',
            'P009Controller.m',
            'P052Controller.m',
            'P039Controller.m',
            'Momentarius.m',
            'Persistence.m'
          ]
          
          files_to_add.each do |filename|
            # Check if already in target
            existing = target.source_build_phase.files.find { |f| 
              f.file_ref&.path == filename || f.file_ref&.path == "Exploit/#{filename}"
            }
            
            if existing
              puts "✓ #{filename} already in target"
              next
            end
            
            # Find or create file reference in Exploit group
            file_ref = exploit_group.files.find { |f| f.path == filename }
            
            if file_ref.nil?
              file_ref = exploit_group.new_file(filename)
              puts "+ Created file reference for #{filename}"
            else
              puts "✓ File reference exists for #{filename}"
            end
            
            # Add to target's compile sources
            target.source_build_phase.add_file_reference(file_ref)
            puts "+ Added #{filename} to Compile Sources"
          end
          
          project.save
          puts '💾 Project saved successfully'
          RUBY

      - name: Show Xcode / schemes
        run: |
          set -euo pipefail
          ls -la Lum1na.xcodeproj/xcshareddata/xcschemes/ || echo "No shared schemes"
          xcodebuild -list -project Lum1na.xcodeproj

      - name: Build (unsigned, for TrollStore / SideStore resign)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lum1na.xcodeproj \
            -scheme Lum1na \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name 'Lum1na.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "❌ Lum1na.app not found under DerivedData"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -type d -print || true
            exit 1
          fi
          echo "✅ Using app: $APP"
          rm -rf Payload Lum1na.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Lum1na.ipa Payload
          ls -lh Lum1na.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lum1na-ipa
          path: Lum1na.ipa
          if-no-files-found: error
