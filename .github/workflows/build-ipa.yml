name: Lum1na Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

# One IPA run per ref. A second push used to stack 3 macos-15 jobs and
# starve Validation/Build IPA (cancelled with no log, runner_id=0).
concurrency:
  group: lum1na-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: Lum1na
  SCHEME_NAME: Lum1na
  DEPLOYMENT_TARGET: "17.0"

jobs:
  # File/grep only. macos-15 is reserved for xcodebuild so this job
  # cannot sit in the Mac queue and skip Build IPA.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "🔍 Validation"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # 1. Bridging Header Validation
      # ============================================
      - name: Validate Bridging Header
        run: |
          set -euo pipefail
          echo "=== Validating Bridging Header ==="

          BRIDGING_HEADER="${PROJECT_NAME}-Bridging-Header.h"

          if [ ! -f "$BRIDGING_HEADER" ]; then
            echo "❌ ERROR: $BRIDGING_HEADER not found!"
            exit 1
          fi
          echo "✓ Found $BRIDGING_HEADER"

          # macOS-only headers that break iOS builds
          MACOS_ONLY_HEADERS=(
            "mach/mach_vm.h"
            "IOKit/IOBSD.h"
            "libkern/OSAtomic.h"
            "mach/mach_interface.h"
            "mach/mach_host.h"
            "mach/mach_voucher.h"
            "mach-o/arch.h"
            "mach-o/fat.h"
            "mach-o/swap.h"
          )

          FOUND_BAD=0
          for header in "${MACOS_ONLY_HEADERS[@]}"; do
            if grep -qE '#(import|include).*<'"$header"'>' "$BRIDGING_HEADER" 2>/dev/null; then
              echo "❌ ERROR: macOS-only header: $header"
              FOUND_BAD=1
            fi
          done

          # New-stage imports must be present or Swift cannot see the probes
          REQUIRED_IMPORTS=(
            "Exploit/ANEDirectIn.h"
            "Exploit/IOGPUStaleEntryProbe.h"
            "Exploit/IOGPUReplaceRaceProbe.h"
            "Exploit/GPUStalePageProbe.h"
            "Exploit/KRWBridge.h"
            "Exploit/P065FacetAOracle.h"
            "Exploit/P070ChainSequencer.h"
            "Exploit/P072FileParserMap.h"
            "Exploit/Lum1naKreadTest.h"
            "Exploit/lumina_core.h"
          )
          for req in "${REQUIRED_IMPORTS[@]}"; do
            if ! grep -q "#import \"$req\"" "$BRIDGING_HEADER"; then
              echo "❌ ERROR: bridging header missing #import \"$req\""
              FOUND_BAD=1
            fi
          done

          if [ $FOUND_BAD -eq 1 ]; then
            echo ""
            echo "📝 Fix bridging header before building"
            exit 1
          fi

          echo "✓ Bridging header validation passed"

      # ============================================
      # 2. Source Files Verification
      # ============================================
      - name: Verify Source Files
        run: |
          echo "=== Verifying Source Files ==="

          # --- HARD REQUIRED: new stages + core chain (build fails if missing) ---
          required_files=(
            "${PROJECT_NAME}-Bridging-Header.h"
            "App/ContentView.swift"
            "UI/Lum1naViewModel.swift"
            "UI/LabOffsets.swift"
            "Exploit/P044ExploitController.h"
            "Exploit/P027MetalCallback.h"
            "Exploit/P027MetalCallback.m"
            "Exploit/P044ExploitController.m"
            "Exploit/LightSword.h"
            "Exploit/LightSword.m"
            "Exploit/ANE254InputController.h"
            "Exploit/ANE254InputController.m"
            "Exploit/ANEDirectIn.h"
            "Exploit/ANEDirectIn.m"
            "Exploit/GPUStalePageProbe.h"
            "Exploit/GPUStalePageProbe.m"
            "Exploit/IOGPUStaleEntryProbe.m"
            "Exploit/IOGPUReplaceRaceProbe.m"
            "Exploit/IOGPUStaleEntryProbe.h"
            "Exploit/IOGPUReplaceRaceProbe.h"
            "Exploit/iokit_shim.h"
            "Exploit/iokit_shim.c"
            "Exploit/Lum1naSocketKRW.h"
            "Exploit/Lum1naSocketKRW.m"
            "Exploit/LabRuntimeOffsets.h"
            "Exploit/A14_23F77_LabOffsets.h"
            "Exploit/A12X_23G71_LabOffsets.h"
            "Kernel/Lum1naBoard.h"
            "Kernel/Lum1naBoard.m"
            "Exploit/KRWBridge.m"
            "Exploit/BadQueryProbe.h"
            "Exploit/BadQueryProbe.m"
            "Exploit/ANE254ChainController.h"
            "Exploit/ANE254ChainController.m"
            "Exploit/KRWChainController.h"
            "Exploit/KRWChainController.m"
            "Exploit/lumina_core.h"
            "Exploit/lumina_core.c"
            "Exploit/DopaminePrimitives.h"
            "Exploit/DopaminePrimitives.m"
            "Exploit/P065FacetAOracle.h"
            "Exploit/P065FacetAOracle.m"
            "Exploit/P070ChainSequencer.h"
            "Exploit/P070ChainSequencer.m"
            "Exploit/P072FileParserMap.h"
            "Exploit/P072FileParserMap.m"
            "Exploit/Lum1naKreadTest.h"
            "Exploit/Lum1naKreadTest.m"
            "Exploit/P064Ht149041ChainMap.h"
            "Exploit/P064Ht149041ChainMap.m"
            "Exploit/ColdForge.h"
            "Exploit/ColdForge.m"
            "Exploit/Rapier.h"
            "Exploit/Rapier.m"
            "Exploit/Anvil.h"
            "Exploit/Anvil.m"
            "Exploit/LightSwordABC.h"
            "Exploit/LightSwordABC.m"
          )

          MISSING=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "❌ $file MISSING"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "📝 Add the missing files listed above, then re-run"
            exit 1
          fi

          # --- SOFT CHECK: probe family (warn only — some are intentionally
          #     disabled per build, e.g. AVERace removal below) ---
          echo ""
          echo "=== Probe family presence (informational) ==="
          for probe in P005JIT P009ReplaceBackingSmoke P010QueueLeak \
                       P017ConfusedDeputy P032ANEOpenSmoke P033CoreML1in1out \
                       P034Kmsg3072Occupancy P038WHuntSmoke P040NamespaceDestSmoke \
                       P041SlideDestMap P042ReachabilityProbe P043WriteClassMap \
                       P045HybridMap P046F77PatchOracle P050GetattrlistOOB \
                       P051APFSXattr P052APFSNstream P053NECPDoubleFree \
                       P054APFSReapList P055IOSurfaceUPL P056VTCompressionReach \
                       P057WVEKReach P058JPEGDriverReach P061AVEEncTypeReach \
                       AKSExploitController CSKRW LightSwordCalib APFS84523 \
                       CVE_2026_84530_KASLR DeviceIdentProbe LabDeviceProfile \
                       LabIOGPUQueue; do
            if ls "Exploit/${probe}"* >/dev/null 2>&1 || \
               ls "Exploit/${probe}".* >/dev/null 2>&1; then
              echo "✓ ${probe}"
            else
              echo "⚠️  ${probe} — not found (OK if intentionally disabled)"
            fi
          done

          # Lockdownd chain (subfolder)
          if ls Exploit/Lockdownd/LockdowndFullChain.* >/dev/null 2>&1; then
            echo "✓ LockdowndFullChain"
          else
            echo "⚠️  LockdowndFullChain — not found (OK if intentionally disabled)"
          fi

          echo ""
          echo "✅ All hard-required source files verified"

      # ============================================
      # 3. iOS 18 Universal App Icon Verification
      # ============================================
      - name: Verify iOS 18 Universal App Icons
        run: |
          set -euo pipefail
          echo "=== Validating iOS 18 Universal App Icons ==="

          ICON_DIR="Assets.xcassets/AppIcon.appiconset"

          if [ ! -d "$ICON_DIR" ]; then
            echo "❌ ERROR: $ICON_DIR not found"
            exit 1
          fi

          if [ ! -f "$ICON_DIR/Contents.json" ]; then
            echo "❌ ERROR: Contents.json missing"
            exit 1
          fi

          REQUIRED_ICONS=(
            "AppIcon.jpg"
            "AppIcon-Dark.jpg"
            "AppIcon-Tinted.jpg"
          )

          MISSING=0
          for icon in "${REQUIRED_ICONS[@]}"; do
            if [ -f "$ICON_DIR/$icon" ]; then
              echo "✓ Found $icon"
            else
              echo "❌ Missing $icon"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "❌ iOS 18 Universal App Icon validation failed"
            exit 1
          fi

          echo "✅ App Icons validated"

      # ============================================
      # 4. Model Files Check
      # ============================================
      - name: Verify Model Files
        run: |
          echo "=== Checking Model Files ==="

          MODEL_NAME="XVRC27_254in_1out_addchain"
          MODEL_PATHS=(
            "model/${MODEL_NAME}.mlmodelc"
            "Resources/${MODEL_NAME}.mlmodelc"
          )

          FOUND=0
          for path in "${MODEL_PATHS[@]}"; do
            if [ -d "$path" ]; then
              echo "✓ Found model at: $path"
              FOUND=1
              break
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "⚠️  Model not found — P044/P059 model-dependent stages will fail at runtime"
          else
            echo "✅ Model files verified"
          fi

          # T8150 (17 Pro Max / 24A435, ane_table_size 0x10b8 = 255-record
          # area) fires the 43748 OOB with the big-in addchains: 300-in
          # (v13b forging stream; 300-in + 1-out = 301 total = 43 records
          # past the 0x10b8 boundary) with the 257-in first-round shape
          # (257-in + 1-out = 258 records = 3 OOB record writes) as
          # fallback. A14/23F77 keeps the 254-in model. All stay bundled.
          MODEL300="XVRC27_300in_1out_addchain"
          for path in "model/${MODEL300}.mlmodelc" "Resources/${MODEL300}.mlmodelc"; do
            if [ -d "$path" ]; then
              echo "✓ Found model at: $path"
              BREAK300=1
              break
            fi
          done
          if [ "${BREAK300:-0}" -ne 1 ]; then
            echo "⚠️  ${MODEL300} not found (T8150 lane falls back to 257-in)"
          else
            echo "✅ ${MODEL300} verified"
          fi
          MODEL257="XVRC27_257in_1out_addchain"
          for path in "model/${MODEL257}.mlmodelc" "Resources/${MODEL257}.mlmodelc"; do
            if [ -d "$path" ]; then
              echo "✓ Found model at: $path"
              BREAK257=1
              break
            fi
          done
          if [ "${BREAK257:-0}" -ne 1 ]; then
            echo "⚠️  ${MODEL257} not found (A14 23F77 lane unaffected — 254-in model is bundled)"
          else
            echo "✅ ${MODEL257} verified"
          fi

  # ============================================
  # Job 2: Build (only if validate passes)
  # ============================================
  build:
    runs-on: macos-15
    needs: validate
    timeout-minutes: 45
    name: "🔨 Build IPA"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          # Xcode_2*.app matches Xcode 26.x. sort -V then picks 26 over 16.4
          # and Xcode 26 copies nested README.md into Lum1na.app/README.md.
          if [ -d /Applications/Xcode_16.4.app ]; then
            XCODE=/Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            XCODE=/Applications/Xcode_16.3.app
          else
            XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "${XCODE:-}" ] || [ ! -d "$XCODE" ]; then
            echo "ERROR: Xcode 16.x not found"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          # Do not pipe xcodebuild -version into head: NSFileHandle write
          # aborts on SIGPIPE and the step dies even on Xcode 16.4.
          xcodebuild -version

      - name: Remove Problematic AVE Files
        run: |
          echo "=== Removing dual-session AVERace only (P056 is the VT reach tap) ==="
          rm -f Exploit/AVERace.m Exploit/AVERace.h 2>/dev/null || true
          echo "✅ Removed AVERace"

      # The lab app (P007OpenOnly/) carries its own .xcodeproj. Under the
      # path="." synchronized root Xcode discovers it as an implicit
      # subproject and merges its products into Lum1na.app ("Multiple
      # commands produce Info.plist/mlmodelc/ContentView.stringsdata").
      # membershipExceptions cannot stop subproject discovery, so the shell
      # build simply removes the lab tree first. The build-debug job runs in
      # a separate checkout and is unaffected.
      - name: Remove Lab App Tree (implicit-subproject guard)
        run: |
          rm -rf P007OpenOnly
          echo "✅ Removed P007OpenOnly from the shell-build tree"
          # Host-only trees. Xcode 26 Copy Bundle Resources flattens nested
          # README.md to Lum1na.app/README.md (rust/ + tools/ collide).
          rm -rf rust tools
          echo "✅ Removed rust/ and tools/ from the shell-build tree"

      # ============================================
      # Entitlements — covers every user client + service we touch:
      #   ANE:     AppleH11ANEInterface (P059 selector 2 direct path)
      #   IOGPU:   IOGPUDevice user client (P061/P062 sel-36 ABI)
      #   Surface: IOSurfaceRootUserClient (surfaces for both paths)
      #   CoreML:  P044 model load fallback path
      #   VT/AVE:  P056/P057 reach taps
      # NOTE: unsigned build embeds these at re-sign time (ldid/Sideloadly),
      #       but keeping them here ensures the .app payloads match.
      # ============================================
      - name: Create Entitlements
        run: |
          cat > Lum1na.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <!-- CoreML (P044 model fallback path) -->
              <key>com.apple.developer.coreml</key>
              <true/>

              <!-- IOSurface (ANE overflow surfaces + 64788 resources) -->
              <key>com.apple.private.IOSurface</key>
              <true/>

              <!-- ANE direct driver access (P059) -->
              <key>com.apple.private.ane</key>
              <true/>
              <key>com.apple.private.ane.allow</key>
              <true/>

              <!-- IOKit user client classes used by the probe set -->
              <key>com.apple.security.exception.iokit-user-client-class</key>
              <array>
                  <string>AppleNeuralEngineUserClient</string>
                  <string>AppleH11ANEInterface</string>
                  <string>IOSurfaceRootUserClient</string>
                  <string>IOGPUDevice</string>
                  <string>IOGPUDeviceUserClient</string>
                  <string>IOAccelDevice</string>
                  <string>IOAccelContext</string>
                  <string>AppleAVE2UserClient</string>
                  <string>AppleJPEGDriverUserClient</string>
                  <string>AppleValidatorUserClient</string>
              </array>

              <!-- Mach service lookups (aned diagnostics channel) -->
              <key>com.apple.security.exception.mach-lookup.global-names</key>
              <array>
                  <string>com.apple.ane.diagnostics</string>
                  <string>com.apple.backboardd.launchapplications</string>
              </array>

              <!-- VideoToolbox / CoreMedia (P056/P057) -->
              <key>com.apple.developer.video-toolbox</key>
              <true/>

              <!-- Debugging -->
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "✅ Entitlements written"

      # ============================================
      # Framework Injection — detects frameworks referenced by our new code
      # but absent from the pbxproj (IOSurface/IOKit/CoreML/VideoToolbox)
      # ============================================
      - name: Detect and Inject Missing Frameworks
        id: framework-injection
        run: |
          set -e

          echo "🔍 Detecting missing frameworks..."

          PROJECT_FILE="${PROJECT_NAME}.xcodeproj/project.pbxproj"

          declare -a REQUIRED=(
            "IOSurface"
            "IOKit"
            "CoreML"
            "Foundation"
            "UIKit"
            "CoreVideo"
            "VideoToolbox"
            "CoreMedia"
          )

          MISSING=()
          for fw in "${REQUIRED[@]}"; do
            if ! grep -q "${fw}.framework" "$PROJECT_FILE" 2>/dev/null; then
              MISSING+=("$fw")
              echo "  ⚠️  Missing: $fw.framework"
            fi
          done

          OTHER_LDFLAGS=""
          for fw in "${MISSING[@]}"; do
            OTHER_LDFLAGS="$OTHER_LDFLAGS -framework $fw"
          done

          echo "other_ldflags=$OTHER_LDFLAGS" >> $GITHUB_OUTPUT

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚡ Will inject: $OTHER_LDFLAGS"
          else
            echo "✅ All frameworks present"
          fi

      # ============================================
      # Build — unsigned (signed at deploy time)
      # ============================================
      - name: Build Unsigned IPA
        env:
          OTHER_LDFLAGS: ${{ steps.framework-injection.outputs.other_ldflags }}
        run: |
          set -euo pipefail
          echo "=== Starting Xcode Build ==="
          set +e
          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="Lum1na.entitlements" \
            SWIFT_OBJC_BRIDGING_HEADER="${PROJECT_NAME}-Bridging-Header.h" \
            IPHONEOS_DEPLOYMENT_TARGET="${DEPLOYMENT_TARGET}" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ]; then
            echo ""
            echo "================ REAL ERRORS ================"
            grep -nE ": error: |fatal error" "$RUNNER_TEMP/build.log" | grep -v "cc1\|Failed frontend" | head -40
            echo "============================================="
            exit $RC
          fi

      - name: Upload full build log (always, every failure retrievable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/build.log
          retention-days: 3

      # ============================================
      # Package IPA
      # ============================================
      - name: Package IPA
        run: |
          set -euo pipefail

          echo "=== Packaging IPA ==="

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d -name "${PROJECT_NAME}.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: built .app not found"
            exit 1
          fi
          echo "✓ Found app: $APP_PATH"

          mkdir -p "Payload"
          cp -R "$APP_PATH" "Payload/"

          # Embed entitlements next to the binary for the sign step
          cp "Lum1na.entitlements" "Payload/${PROJECT_NAME}.app/"

          # a-Shell mini runtime + libssh -> the in-app terminal/SSH (soft:
          # builds green without payloads; the panes report "not embedded").
          for cand in "$HOME/Downloads/Terminal.ipa" "$HOME/Downloads"/a-Shell-mini*.ipa "$HOME/Downloads"/aShell-mini*.ipa; do
            if [ -f "$cand" ]; then
              python3 scripts/merge_ashell.py "Payload/${PROJECT_NAME}.app" "$cand" || true
              break
            fi
          done
          if [ ! -f "Payload/${PROJECT_NAME}.app/Frameworks/libssh.4.dylib" ]; then
            python3 scripts/merge_ashell.py "Payload/${PROJECT_NAME}.app" 2>/dev/null ||               ASHELL_IPA="" python3 scripts/merge_ashell.py "Payload/${PROJECT_NAME}.app" || true
          fi

          # Fake-sign for ldid/Sideloadly compatibility.
          # MUST succeed: the rig install path (Filza/appinst on Dopamine)
          # needs the ldid signature + embedded entitlements. If ldid is
          # missing, install it - do not silently skip.
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi
          ldid -S"Lum1na.entitlements" "Payload/${PROJECT_NAME}.app/${PROJECT_NAME}"
          echo "✅ ldid fake-signed with Lum1na.entitlements"

          zip -r "${PROJECT_NAME}.ipa" "Payload"
          echo "✅ Packaged ${PROJECT_NAME}.ipa"

      - name: Verify IPA
        run: |
          set -euo pipefail

          IPA="${PROJECT_NAME}.ipa"

          if [ ! -f "$IPA" ]; then
            echo "❌ ERROR: $IPA not found"
            exit 1
          fi

          SIZE=$(du -h "$IPA" | cut -f1)
          echo "✅ IPA built: $IPA ($SIZE)"

          # Verify embedded entitlements reference our new IOKit classes
          if command -v ldid >/dev/null 2>&1; then
            ldid -e "Payload/${PROJECT_NAME}.app/${PROJECT_NAME}" | \
              grep -q "AppleH11ANEInterface" && \
              echo "✅ ANE entitlements embedded" || \
              echo "⚠️  ANE entitlements not found in embedded plist"
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.PROJECT_NAME }}-unsigned-ipa"
          path: "${{ env.PROJECT_NAME }}.ipa"
          retention-days: 1

      - name: Build Summary
        run: |
          echo "### 🚀 Lum1na Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| IPA | ✅ uploaded (30-day retention) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**New stages included:** P059 ANEDirectIn · P061 IOGPU 64788 · P062 Stale-Entry Oracle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next:** sideload → run P022 probes first (highest-value untested path)" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 3: Lum1na-Debugger (P007 lab rig app) — primitives on ANY device
  # ============================================
  # The P007OpenOnly lab app (home-screen name "Lum1na-Debugger") is the
  # Cinder-shelled primitive-testing rig: Lum1na TAP catalog, Cinder modules,
  # filesystem, Console, GLM-Edge/Lum1na-Mind tools, IDENT always prints,
  # "runtime profile always wins". IPA artifact name stays
  # Lum1na-Debug-unsigned-ipa. Bundle id stays ma6x9x.P007OpenOnly.
  # Entitlements are the free-account set (game-center + get-task-allow).
  # macos-26 so the compiler is Xcode 26 and the iOS 26 glass
  # branch (#if compiler(>=6.2)) is actually built. The shell Lum1na job
  # stays on macos-15 / Xcode 16.4: Xcode 26 copies nested README.md into
  # Lum1na.app/README.md. Deployment target stays 17.0.
  build-debug:
    runs-on: macos-26
    timeout-minutes: 45
    name: "🔨 Build Lum1na-Debug IPA"
    env:
      # Optional Apple development signing. Set these repository secrets to
      # get Lum1na-Debug-signed-ipa (development profile, device UDIDs, app
      # group). When unset, only the ldid/unsigned artifact is produced.
      DEBUG_P12_BASE64: ${{ secrets.DEBUG_P12_BASE64 }}
      DEBUG_P12_PASSWORD: ${{ secrets.DEBUG_P12_PASSWORD }}
      DEBUG_PROFILE_BASE64: ${{ secrets.DEBUG_PROFILE_BASE64 }}
      DEBUG_KEYCHAIN_PASSWORD: ${{ secrets.DEBUG_KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          # Pin a version. Do not sort Xcode_2*.app — that glob is what
          # pulled Xcode 26 into the shell job and collided README.md.
          if [ -d /Applications/Xcode_26.6.app ]; then
            XCODE=/Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            XCODE=/Applications/Xcode_26.5.app
          elif [ -d /Applications/Xcode_26.4.1.app ]; then
            XCODE=/Applications/Xcode_26.4.1.app
          elif [ -d /Applications/Xcode_26.3.app ]; then
            XCODE=/Applications/Xcode_26.3.app
          else
            echo "ERROR: Xcode 26.x not found"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          # Do not pipe xcodebuild -version into head: NSFileHandle write
          # aborts on SIGPIPE and the step dies.
          xcodebuild -version

      # T8150 (17 Pro Max / 24A435) P073 v13/v13b artifacts: the lab app's
      # bundle carries BOTH addchain models — the committed 254-in
      # (A14/23F77 lane, untouched) and the big-in addchains for the 0x10b8
      # record area (255 in-bounds records): 300-in (v13b forging stream,
      # 301 total = 43 records past the 0x10b8 boundary) with 257-in
      # (v13 first round, 258 total = 3 OOB record writes) as fallback.
      # Compile whichever committed copy is absent — NEVER bundle an
      # uncompiled .mlmodel (coremlc breaks the IPA; ship precompiled
      # .mlmodelc only).
      - name: Ensure XVRC27_300in/257in_1out_addchain.mlmodelc (T8150, compiled)
        run: |
          set -euo pipefail
          for ML in "XVRC27_300in_1out_addchain tools/make_300in_addchain.py" \
                    "XVRC27_257in_1out_addchain tools/make_257in_addchain.py"; do
            set -- $ML
            MODEL="$1"; GEN="$2"
            MLC="P007OpenOnly/P007OpenOnly/${MODEL}.mlmodelc"
            if [ -d "$MLC" ]; then
              echo "✓ Committed ${MLC} present — reusing (deterministic artifact)"
              ls -la "$MLC" | head -3
              continue
            fi
            echo "${MODEL} absent — compiling with coremlc (selected Xcode) via ${GEN}"
            python3 -m venv /tmp/mvenv257
            /tmp/mvenv257/bin/python -m pip install --quiet --upgrade pip
            /tmp/mvenv257/bin/pip install --quiet coremltools numpy
            OUT="$RUNNER_TEMP/${MODEL}out"
            mkdir -p "$OUT"
            /tmp/mvenv257/bin/python "$GEN" "$OUT"
            test -d "$OUT/${MODEL}.mlmodelc"
            cp -R "$OUT/${MODEL}.mlmodelc" "$MLC"
          done

      # Pin 17.0 so Sideloadly can install on 12 mini (iOS 17.3 / 21D50)
      # and every later lab SKU. Do not raise this above 17.0.
      - name: Build Unsigned IPA (Lum1na-Debug)
        run: |
          set -euo pipefail
          echo "=== Starting Lum1na-Debug Build ==="
          set +e
          xcodebuild \
            -project "P007OpenOnly/P007OpenOnly.xcodeproj" \
            -scheme "P007OpenOnly" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="P007OpenOnly/P007OpenOnly/P007OpenOnly.free.entitlements" \
            IPHONEOS_DEPLOYMENT_TARGET="${DEPLOYMENT_TARGET}" \
            build 2>&1 | tee "$RUNNER_TEMP/build-debug.log"
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ]; then
            echo ""
            echo "================ REAL ERRORS (Lum1na-Debug) ================"
            grep -nE ": error: |fatal error" "$RUNNER_TEMP/build-debug.log" | grep -v "cc1\|Failed frontend" | head -40
            echo "============================================="
            exit $RC
          fi

      - name: Package IPA (Lum1na-Debug)
        run: |
          set -euo pipefail
          echo "=== Packaging Lum1na-Debug IPA ==="

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData-Debug/Build/Products" \
            -type d -name "P007OpenOnly.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: P007OpenOnly.app not found"
            exit 1
          fi
          echo "✓ Found app: $APP_PATH (home-screen name: Lum1na-Debugger)"

          mkdir -p "Payload"
          cp -R "$APP_PATH" "Payload/"

          # Free-account entitlements live with the sources — proven on the
          # rig. Embed next to the binary for the sign step + ldid fake-sign
          # so Filza/appinst/Sideloadly accept it.
          cp "P007OpenOnly/P007OpenOnly/P007OpenOnly.free.entitlements" "Payload/P007OpenOnly.app/"
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi
          ldid -S"P007OpenOnly/P007OpenOnly/P007OpenOnly.free.entitlements" "Payload/P007OpenOnly.app/P007OpenOnly"
          echo "✅ ldid fake-signed with P007OpenOnly.free.entitlements (app-group + get-task-allow)"

          # a-Shell mini + libssh embeds for the debug terminal (soft)
          for cand in "$HOME/Downloads/Terminal.ipa" "$HOME/Downloads"/a-Shell-mini*.ipa "$HOME/Downloads"/aShell-mini*.ipa; do
            if [ -f "$cand" ]; then
              python3 scripts/merge_ashell.py "Payload/P007OpenOnly.app" "$cand" || true
              break
            fi
          done
          ASHELL_IPA="" python3 scripts/merge_ashell.py "Payload/P007OpenOnly.app" || true

          zip -r "Lum1na-Debug.ipa" "Payload"
          echo "✅ Packaged Lum1na-Debug.ipa"

      - name: Sign IPA with development profile (optional)
        if: env.DEBUG_P12_BASE64 != '' && env.DEBUG_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/signing"
          KC="$WORK/debug.keychain-db"
          mkdir -p "$WORK"
          printf '%s' "$DEBUG_P12_BASE64" | base64 --decode > "$WORK/debug.p12"
          printf '%s' "$DEBUG_PROFILE_BASE64" | base64 --decode > "$WORK/debug.mobileprovision"
          security create-keychain -p "$DEBUG_KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$DEBUG_KEYCHAIN_PASSWORD" "$KC"
          security import "$WORK/debug.p12" -k "$KC" -P "$DEBUG_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$DEBUG_KEYCHAIN_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*) \([0-9A-F]\{40\}\) .*/\1/p' | head -1)
          if [ -z "${IDENTITY:-}" ]; then
            echo "ERROR: no code-signing identity in the imported p12"
            security find-identity -v -p codesigning "$KC" || true
            exit 1
          fi
          echo "identity: $IDENTITY"
          security cms -D -i "$WORK/debug.mobileprovision" > "$WORK/profile.plist"
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$WORK/profile.plist")
          TEAMID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" "$WORK/profile.plist")
          echo "profile AppID: $APPID  team: $TEAMID"
          case "$APPID" in
            *ma6x9x.P007OpenOnly) ;;
            *) echo "ERROR: profile is not for ma6x9x.P007OpenOnly"; exit 1 ;;
          esac
          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" "$WORK/profile.plist" 2>/dev/null | grep -q "group.com.Lum1naDebug"; then
            echo "ERROR: profile does not contain group.com.Lum1naDebug"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$WORK/profile.plist" >/dev/null 2>&1; then
            echo "ERROR: profile has no ProvisionedDevices (not a development profile?)"
            exit 1
          fi
          cp P007OpenOnly/P007OpenOnly/P007OpenOnly.free.entitlements "$WORK/ent.plist"
          /usr/libexec/PlistBuddy -c "Add :application-identifier string $APPID" "$WORK/ent.plist"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAMID" "$WORK/ent.plist"
          cp "$WORK/debug.mobileprovision" "Payload/P007OpenOnly.app/embedded.mobileprovision"
          if [ -d "Payload/P007OpenOnly.app/Frameworks" ]; then
            find "Payload/P007OpenOnly.app/Frameworks" -depth \( -name "*.dylib" -o -name "*.framework" \) | while read -r f; do
              codesign --force --sign "$IDENTITY" --timestamp=none "$f"
            done
          fi
          codesign --force --sign "$IDENTITY" --entitlements "$WORK/ent.plist" --timestamp=none "Payload/P007OpenOnly.app"
          codesign --verify --deep --strict --verbose=2 "Payload/P007OpenOnly.app"
          rm -rf Payload-signed && mkdir -p Payload-signed/Payload
          cp -R "Payload/P007OpenOnly.app" "Payload-signed/Payload/"
          (cd Payload-signed && zip -qry ../Lum1na-Debug-signed.ipa Payload)
          echo "✅ Signed IPA: Lum1na-Debug-signed.ipa"

      - name: Verify IPA (Lum1na-Debug)
        run: |
          set -euo pipefail
          IPA="Lum1na-Debug.ipa"
          if [ ! -f "$IPA" ]; then
            echo "❌ ERROR: $IPA not found"
            exit 1
          fi
          SIZE=$(du -h "$IPA" | cut -f1)
          echo "✅ IPA built: $IPA ($SIZE)"
          if command -v ldid >/dev/null 2>&1; then
            ldid -e "Payload/P007OpenOnly.app/P007OpenOnly" | grep -q "get-task-allow" && \
              echo "✅ get-task-allow embedded" || \
              echo "⚠️  get-task-allow missing from embedded plist"
          fi

      - name: Upload IPA Artifact (Lum1na-Debug)
        uses: actions/upload-artifact@v4
        with:
          name: "Lum1na-Debug-unsigned-ipa"
          path: "Lum1na-Debug.ipa"
          retention-days: 1

      - name: Upload Signed IPA (Lum1na-Debug, optional)
        if: env.DEBUG_P12_BASE64 != '' && env.DEBUG_PROFILE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: "Lum1na-Debug-signed-ipa"
          path: "Lum1na-Debug-signed.ipa"
          retention-days: 7

      - name: Build Summary (Lum1na-Debug)
        run: |
          echo "### 🔬 Lum1na-Debug Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| IPA | ✅ Lum1na-Debug-unsigned-ipa (30-day retention) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Runs P005–P099 primitives on ANY device (IDENT prints; unknown SKUs HOLD kernel-VA probes honestly)." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Term Lite — standalone payload-soft terminal
  # ============================================
  build-termlite:
    runs-on: macos-15
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Build TermLite (unsigned)
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_16.4.app
          [ -d "$XCODE" ] && DEVELOPER_DIR="$XCODE/Contents/Developer"
          export DEVELOPER_DIR="${DEVELOPER_DIR:-$(xcode-select -p)}"
          xcodebuild             -project termlite/TermLite.xcodeproj             -scheme TermLite             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/td"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build 2>&1 | tee "$RUNNER_TEMP/tl.log"
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            grep -nE ": error: |fatal error" "$RUNNER_TEMP/tl.log" | head -30 || true
            exit $RC
          fi
          echo "✅ TermLite built"

      - name: Package + soft payload embed
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/td/Build/Products/Release-iphoneos" -name "TermLite.app" | head -1)
          [ -n "$APP" ] || { echo "no TermLite.app"; exit 1; }
          mkdir -p Payload && cp -R "$APP" Payload/
          for cand in "$HOME/Downloads/Terminal.ipa" "$HOME/Downloads"/a-Shell-mini*.ipa "$HOME/Downloads"/aShell-mini*.ipa; do
            if [ -f "$cand" ]; then
              python3 scripts/merge_ashell.py "Payload/TermLite.app" "$cand" || true
              break
            fi
          done
          # libssh embed is inside the payload branch of merge_ashell (openssl dep)
          if ! command -v ldid >/dev/null 2>&1; then brew install ldid; fi
          ldid -S"termlite/TermLite/TermLite.entitlements" "Payload/TermLite.app/TermLite"
          ASHELL_IPA="" python3 scripts/merge_ashell.py "Payload/TermLite.app" || true
          zip -r TermLite.ipa Payload
          echo "✅ TermLite.ipa packaged"

      - name: Upload TermLite.ipa
        uses: actions/upload-artifact@v4
        with:
          name: TermLite-unsigned-ipa
          path: TermLite.ipa

