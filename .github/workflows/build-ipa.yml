name: Lum1na Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

env:
  PROJECT_NAME: Lum1na
  SCHEME_NAME: Lum1na
  DEPLOYMENT_TARGET: 14.0

jobs:
  # ============================================
  # Job 1: Validate (catches errors early)
  # ============================================
  validate:
    runs-on: macos-15
    name: "Validate Build Environment"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      # ============================================
      # Validate Bridging Header (FIXED)
      # ============================================
      - name: Validate Bridging Header
        run: |
          set -euo pipefail
          echo "=== Validating Bridging Header ==="
          
          BRIDGING_HEADER="Lum1na-Bridging-Header.h"
          
          if [ ! -f "$BRIDGING_HEADER" ]; then
            echo "❌ ERROR: $BRIDGING_HEADER not found!"
            exit 1
          fi
          echo "✓ Found $BRIDGING_HEADER"
          
          # Check for macOS-only headers
          MACOS_ONLY_HEADERS=(
            "mach/mach_vm.h"
            "IOKit/IOBSD.h"
            "IOKit/storage/IOStorageDeviceCharacteristics.h"
            "IOKit/storage/IOStorageProtocolCharacteristics.h"
            "libkern/OSAtomic.h"
            "mach/mach_interface.h"
            "mach/mach_port.h"
            "mach/mach_host.h"
            "mach/mach_types.defs"
            "mach/mach_voucher.h"
            "mach-o/arch.h"
            "mach-o/fat.h"
            "mach-o/reloc.h"
            "mach-o/swap.h"
            "sys/syscall.h"
          )
          
          FOUND_BAD_HEADERS=0
          for header in "${MACOS_ONLY_HEADERS[@]}"; do
            if grep -q "#import.*<$header>" "$BRIDGING_HEADER" 2>/dev/null || \
               grep -q "#include.*<$header>" "$BRIDGING_HEADER" 2>/dev/null; then
              echo "❌ ERROR: Found macOS-only header: $header"
              FOUND_BAD_HEADERS=1
            fi
          done
          
          if [ $FOUND_BAD_HEADERS -eq 1 ]; then
            echo ""
            echo "📝 To fix:"
            echo "  mach/mach_vm.h → mach/vm_map.h"
            echo "  IOKit/IOBSD.h  → (remove - not available on iOS)"
            echo ""
            exit 1
          fi
          
          echo "✓ No macOS-only headers found"
          
          # Test compile bridging header with iOS SDK (FIXED: added -x objective-c)
          echo "=== Testing Bridging Header Compilation ==="
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          if ! clang -x objective-c -fsyntax-only \
            -target arm64-apple-ios${DEPLOYMENT_TARGET} \
            -isysroot "$SDK_PATH" \
            -I"$(pwd)/Exploit" \
            -framework Foundation \
            -framework UIKit \
            -framework IOKit \
            "$BRIDGING_HEADER" 2>&1 | tee /tmp/bridging_header_errors.log; then
            
            echo ""
            echo "❌ BRIDGING HEADER VALIDATION FAILED"
            echo "See /tmp/bridging_header_errors.log above for details."
            exit 1
          fi
          
          echo "✓ Bridging header compiles successfully with iOS SDK"
      # ============================================
      # Validate iOS 18 Universal App Icons
      # ============================================
      - name: Verify iOS 18 Universal App Icon Structure
        run: |
          set -euo pipefail
          echo "=== Validating iOS 18 Universal App Icons ==="
          
          ICON_DIR="Assets.xcassets/AppIcon.appiconset"
          
          if [ ! -d "$ICON_DIR" ]; then
            echo "❌ ERROR: $ICON_DIR directory not found"
            exit 1
          fi
          echo "✓ Found $ICON_DIR"
          
          if [ ! -f "$ICON_DIR/Contents.json" ]; then
            echo "❌ ERROR: Contents.json missing from $ICON_DIR"
            exit 1
          fi
          echo "✓ Found Contents.json"
          
          # Required iOS 18 Universal App Icon files
          REQUIRED_ICONS=(
            "AppIcon.jpg"
            "AppIcon-Dark.jpg"
            "AppIcon-Tinted.jpg"
          )
          
          MISSING_ICONS=0
          for icon in "${REQUIRED_ICONS[@]}"; do
            if [ -f "$ICON_DIR/$icon" ]; then
              echo "✓ Found $icon"
            else
              echo "❌ Missing $icon"
              MISSING_ICONS=1
            fi
          done
          
          if [ $MISSING_ICONS -eq 1 ]; then
            echo ""
            echo "❌ iOS 18 Universal App Icon validation failed"
            echo ""
            echo "Required files for iOS 18:"
            echo "  - AppIcon.jpg (light mode)"
            echo "  - AppIcon-Dark.jpg (dark mode)"
            echo "  - AppIcon-Tinted.jpg (tinted mode)"
            echo ""
            exit 1
          fi
          
          # Validate Contents.json has proper iOS 18 structure
          if ! grep -q "universal" "$ICON_DIR/Contents.json" && \
             ! grep -q "ios-marketing" "$ICON_DIR/Contents.json"; then
            echo "⚠️ Warning: Contents.json may not have proper iOS 18 universal icon definitions"
          fi
          
          echo "✅ iOS 18 Universal App Icons validated"

      # ============================================
      # Validate Source Files Exist
      # ============================================
      - name: Verify Source Files
        run: |
          set -euo pipefail
          echo "=== Verifying Source Files ==="
          
          required_files=(
            "Exploit/P044AksKaslrReach.m"
            "Exploit/CVE_2026_65343_AKS.m"
            "Exploit/P051APFSXattr.m"
            "Exploit/P054APFSReapList.m"
            "Exploit/LabRuntimeOffsets.m"
            "Exploit/LabDeviceProfile.m"
            "UI/LabOffsets.swift"
          )
          
          MISSING=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "❌ $file MISSING"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "❌ Required source files missing"
            exit 1
          fi
          
          echo "✅ All source files verified"

      # ============================================
      # Validate Model Files
      # ============================================
      - name: Verify Model Files
        run: |
          echo "=== Checking Model Files ==="
          
          MODEL_NAME="XVRC27_254in_1out_addchain"
          MODEL_PATHS=(
            "model/${MODEL_NAME}.mlmodelc"
            "Resources/${MODEL_NAME}.mlmodelc"
            "${MODEL_NAME}.mlmodelc"
          )
          
          FOUND=0
          for path in "${MODEL_PATHS[@]}"; do
            if [ -d "$path" ]; then
              echo "✓ Found model at: $path"
              FOUND=1
              break
            fi
          done
          
          if [ $FOUND -eq 0 ]; then
            echo "⚠️ Model not found - build may fail if model is required"
          else
            echo "✅ Model files verified"
          fi

  # ============================================
  # Job 2: Build (only runs if validate passes)
  # ============================================
  build:
    runs-on: macos-15
    needs: validate
    timeout-minutes: 45
    name: "Build IPA"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      # ============================================
      # Setup Entitlements
      # ============================================
      - name: Create Entitlements
        run: |
          cat > Lum1na.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <!-- CoreML & Research -->
              <key>com.apple.developer.coreml</key>
              <true/>
              
              <!-- Required for research tools -->
              <key>get-task-allow</key>
              <true/>
              
              <!-- IOKit access -->
              <key>com.apple.private.IOSurface</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "✅ Created entitlements"

      # ============================================
      # Build with Proper iOS Settings
      # ============================================
      - name: Build Unsigned IPA
        run: |
          set -euo pipefail
          echo "=== Building ${PROJECT_NAME} ==="
          
          # Clean build
          xcodebuild clean \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            2>&1 | tee /tmp/xcodebuild_clean.log
          
          # Build
          xcodebuild build \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="Lum1na.entitlements" \
            SWIFT_OBJC_BRIDGING_HEADER="${PROJECT_NAME}-Bridging-Header.h" \
            IPHONEOS_DEPLOYMENT_TARGET="${DEPLOYMENT_TARGET}" \
            ENABLE_BITCODE=NO \
            GCC_PREPROCESSOR_DEFINITIONS="DEBUG=0" \
            2>&1 | tee /tmp/xcodebuild.log
          
          BUILD_STATUS=${PIPESTATUS[0]}
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo ""
            echo "❌ BUILD FAILED"
            echo ""
            echo "Last 50 lines of build log:"
            tail -50 /tmp/xcodebuild.log
            exit 1
          fi
          
          echo "✅ Build succeeded"

      # ============================================
      # Package IPA
      # ============================================
      - name: Package IPA
        run: |
          set -euo pipefail
          echo "=== Packaging IPA ==="
          
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "${PROJECT_NAME}.app" -print -quit)
          
          if [ -z "$APP" ]; then
            echo "❌ ${PROJECT_NAME}.app not found"
            echo "Build products:"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name "*.app" 2>/dev/null || true
            exit 1
          fi
          
          echo "Found app at: $APP"
          ls -la "$APP"
          
          # Create Payload
          rm -rf Payload "${PROJECT_NAME}.ipa"
          mkdir Payload
          cp -R "$APP" Payload/
          
          # Create IPA
          zip -qr "${PROJECT_NAME}.ipa" Payload
          
          echo "✅ Created ${PROJECT_NAME}.ipa"
          ls -lh "${PROJECT_NAME}.ipa"
          
          # Verify IPA contents
          echo "=== IPA Contents ==="
          unzip -l "${PROJECT_NAME}.ipa" | head -20

      # ============================================
      # Upload Artifact
      # ============================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lum1na-IPA
          path: Lum1na.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================
      # Upload Logs on Failure
      # ============================================
      - name: Upload Build Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/xcodebuild.log
            /tmp/bridging_header_errors.log
          if-no-files-found: ignore
