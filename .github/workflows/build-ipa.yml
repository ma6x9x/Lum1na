name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify source files exist
        run: |
          set -euo pipefail
          echo "=== Verifying source files ==="
          
          files=(
            "Exploit/ClearSword.m"
            "Exploit/ANE.m"
            "Exploit/KASLRLeak.m"
            "Exploit/CSKRW.m"
            "Exploit/UPLLeak.m"
            "Exploit/AVERace.m"
            "Exploit/Lum1naKRW.m"
            "Exploit/FusionChain.m"
            "Exploit/P009Controller.m"
            "Exploit/P052Controller.m"
            "Exploit/P039Controller.m"
            "Exploit/Momentarius.m"
            "Exploit/Persistence.m"
          )
          
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file MISSING"
              exit 1
            fi
          done

      - name: Fix Import Paths (cs_run.h)
        run: |
          # Verify cs_run.h uses correct relative imports
          if grep -q '#import "Exploit/' Exploit/Bridges/cs_run.h; then
            echo "⚠️ Fixing cs_run.h imports..."
            sed -i '' 's|#import "Exploit/|#import "../|g' Exploit/Bridges/cs_run.h
            echo "✅ Fixed cs_run.h imports"
          fi

      - name: Add Files to Xcode Target (Skip Duplicates)
        run: |
          set -euo pipefail
          gem install xcodeproj
          ruby << 'RUBY'
          require 'xcodeproj'
          
          project = Xcodeproj::Project.open('Lum1na.xcodeproj')
          target = project.targets.find { |t| t.name == 'Lum1na' }
          
          exploit_group = project.main_group.groups.find { |g| g.path == 'Exploit' }
          if exploit_group.nil?
            puts '❌ Exploit group not found'
            exit 1
          end
          
          files_to_add = [
            'ClearSword.m', 'ANE.m', 'KASLRLeak.m', 'CSKRW.m',
            'UPLLeak.m', 'AVERace.m', 'Lum1naKRW.m', 'FusionChain.m',
            'P009Controller.m', 'P052Controller.m', 'P039Controller.m',
            'Momentarius.m', 'Persistence.m'
          ]
          
          files_to_add.each do |filename|
            # Skip if already in target
            existing = target.source_build_phase.files.find { |f| 
              f.file_ref&.path == filename || f.file_ref&.path == "Exploit/#{filename}"
            }
            
            if existing
              puts "✓ #{filename} already in target"
              next
            end
            
            # Find file reference
            file_ref = exploit_group.files.find { |f| f.path == filename }
            next if file_ref.nil?
            
            # Add to target
            target.source_build_phase.add_file_reference(file_ref)
            puts "+ Added #{filename}"
          end
          
          project.save
          puts '💾 Project saved'
          RUBY

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lum1na.xcodeproj \
            -scheme Lum1na \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            GCC_WARN_ABOUT_DUPLICATE_METHOD_NAME=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name 'Lum1na.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "❌ Lum1na.app not found"
            exit 1
          fi
          echo "✅ Found: $APP"
          rm -rf Payload Lum1na.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Lum1na.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lum1na-ipa
          path: Lum1na.ipa
          if-no-files-found: error
