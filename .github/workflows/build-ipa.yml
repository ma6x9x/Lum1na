on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify source files exist
        run: |
          set -euo pipefail
          echo "=== Verifying source files ==="
          
          # Core exploit files
          objc_files=(
            "Exploit/CVE_2026_65343_AKS.m"
            "Exploit/APFS84523.m"
            "Exploit/P005JIT.m"
            "Exploit/LabRuntimeOffsets.m"
            "Exploit/LabDeviceProfile.m"
          )
          
          header_files=(
            "Exploit/CVE_2026_65343_AKS.h"
            "Exploit/APFS84523.h"
            "Exploit/P005JIT.h"
            "Exploit/LabRuntimeOffsets.h"
            "Exploit/LabDeviceProfile.h"
            "Exploit/A14_23F77_LabOffsets.h"
            "Exploit/A12X_23G71_LabOffsets.h"
          )
          
          for file in "${objc_files[@]}" "${header_files[@]}"; do
            test -f "$file" || { echo "✗ $file MISSING"; exit 1; }
            echo "✓ $file"
          done
          
          test -f Lum1na-Bridging-Header.h || { echo "✗ Lum1na-Bridging-Header.h MISSING"; exit 1; }
          echo "✅ All source files verified!"

      - name: Verify iOS 18 Universal App Icon Structure
        run: |
          set -euo pipefail
          ICON_DIR="Assets.xcassets/AppIcon.appiconset"
          test -d "$ICON_DIR" || { echo "❌ AppIcon.appiconset missing"; exit 1; }
          test -f "$ICON_DIR/Contents.json" || { echo "❌ Contents.json missing"; exit 1; }
          for file in AppIcon.jpg AppIcon-Dark.jpg AppIcon-Tinted.jpg; do
            test -f "$ICON_DIR/$file" || { echo "❌ $file missing"; exit 1; }
          done
          echo "✅ Icons verified"

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lum1na.xcodeproj \
            -scheme Lum1na \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_OBJC_BRIDGING_HEADER="Lum1na-Bridging-Header.h" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name 'Lum1na.app' -print -quit)
          test -n "$APP" || { echo "❌ Lum1na.app not found"; exit 1; }
          rm -rf Payload Lum1na.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Lum1na.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lum1na-ipa
          path: Lum1na.ipa
          if-no-files-found: error
