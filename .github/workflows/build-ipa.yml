name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Fix Xcode Project (Add missing source files)
        run: |
          set -euo pipefail
          gem install xcodeproj
          ruby << 'RUBY'
          require 'xcodeproj'
          
          project = Xcodeproj::Project.open('Lum1na.xcodeproj')
          target = project.targets.find { |t| t.name == 'Lum1na' }
          
          # Find Exploit group
          exploit_group = project.main_group.groups.find { |g| g.path == 'Exploit' }
          if exploit_group.nil?
            exploit_group = project.main_group.new_group('Exploit', 'Exploit')
          end
          
          # Find Bridges subgroup
          bridges_group = exploit_group.groups.find { |g| g.path == 'Bridges' }
          if bridges_group.nil?
            bridges_group = exploit_group.new_group('Bridges', 'Bridges')
          end
          
          # Add all .m files from Exploit directory
          files_to_add = [
            'Exploit/ClearSword.m',
            'Exploit/ANE.m',
            'Exploit/KASLRLeak.m',
            'Exploit/CSKRW.m',
            'Exploit/UPLLeak.m',
            'Exploit/AVERace.m',
            'Exploit/Lum1naKRW.m'
          ]
          
          files_to_add.each do |filepath|
            next unless File.exist?(filepath)
            
            # Check if already in target
            exists = target.sources_build_phase.files.any? { |f| f.file_ref&.path == filepath }
            if exists
              puts "✓ #{filepath} already in target"
              next
            end
            
            # Find or create file reference
            file_ref = exploit_group.find_file_by_path(filepath)
            if file_ref.nil?
              file_ref = exploit_group.new_file(filepath)
            end
            
            # Add to target and build phase
            target.add_file_references([file_ref])
            target.sources_build_phase.add_file_reference(file_ref)
            puts "+ Added #{filepath} to target"
          end
          
          project.save
          puts "Project updated successfully"
          RUBY

      - name: Show Xcode / schemes
        run: |
          set -euo pipefail
          ls -la Lum1na.xcodeproj/xcshareddata/xcschemes/
          xcodebuild -list -project Lum1na.xcodeproj

      - name: Build (unsigned, for TrollStore / SideStore resign)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lum1na.xcodeproj \
            -scheme Lum1na \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name 'Lum1na.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "Lum1na.app not found under DerivedData"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -type d -print || true
            exit 1
          fi
          echo "Using app: $APP"
          rm -rf Payload Lum1na.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Lum1na.ipa Payload
          ls -lh Lum1na.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lum1na-ipa
          path: Lum1na.ipa
          if-no-files-found: error
