# ============================================
      # Simplified Bridging Header Validation
      # ============================================
      - name: Validate Bridging Header
        run: |
          set -euo pipefail
          echo "=== Validating Bridging Header ==="
          
          BRIDGING_HEADER="${PROJECT_NAME}-Bridging-Header.h"
          
          if [ ! -f "$BRIDGING_HEADER" ]; then
            echo "❌ ERROR: $BRIDGING_HEADER not found!"
            exit 1
          fi
          echo "✓ Found $BRIDGING_HEADER"
          
          # Check for macOS-only headers (text search only, no compilation)
          MACOS_ONLY_HEADERS=(
            "mach/mach_vm.h"
            "IOKit/IOBSD.h"
            "libkern/OSAtomic.h"
            "mach/mach_interface.h"
            "mach/mach_host.h"
            "mach/mach_voucher.h"
            "mach-o/arch.h"
            "mach-o/fat.h"
            "mach-o/swap.h"
            "sys/syscall.h"
          )
          
          FOUND_BAD=0
          for header in "${MACOS_ONLY_HEADERS[@]}"; do
            if grep -q "#import.*<$header>" "$BRIDGING_HEADER" 2>/dev/null || \
               grep -q "#include.*<$header>" "$BRIDGING_HEADER" 2>/dev/null; then
              echo "❌ ERROR: macOS-only header: $header"
              FOUND_BAD=1
            fi
          done
          
          if [ $FOUND_BAD -eq 1 ]; then
            echo ""
            echo "📝 Use iOS-compatible alternatives:"
            echo "  mach/mach_vm.h → mach/vm_map.h"
            echo "  IOKit/IOBSD.h  → (remove)"
            echo "  libkern/OSAtomic.h → os/atomic.h"
            exit 1
          fi
          
          echo "✓ No macOS-only headers found"
          echo "⚠️  Full compilation check skipped (Xcode will validate during build)"
