name: Lum1na Build
on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

env:
  PROJECT_NAME: Lum1na
  SCHEME_NAME: Lum1na
  DEPLOYMENT_TARGET: 18.0

jobs:
  # ============================================
  # Job 1: Validate Everything First
  # ============================================
  validate:
    runs-on: macos-15
    name: "🔍 Validation"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode_16.4.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ============================================
      # 1. Bridging Header Validation
      # ============================================
      - name: Validate Bridging Header
        run: |
          set -euo pipefail
          echo "=== Validating Bridging Header ==="

          BRIDGING_HEADER="${PROJECT_NAME}-Bridging-Header.h"

          if [ ! -f "$BRIDGING_HEADER" ]; then
            echo "❌ ERROR: $BRIDGING_HEADER not found!"
            exit 1
          fi
          echo "✓ Found $BRIDGING_HEADER"

          # Check for macOS-only headers
          MACOS_ONLY_HEADERS=(
            "mach/mach_vm.h"
            "IOKit/IOBSD.h"
            "libkern/OSAtomic.h"
            "mach/mach_interface.h"
            "mach/mach_host.h"
            "mach/mach_voucher.h"
            "mach-o/arch.h"
            "mach-o/fat.h"
            "mach-o/swap.h"
          )

          FOUND_BAD=0
          for header in "${MACOS_ONLY_HEADERS[@]}"; do
            if grep -q "#import.*<$header>" "$BRIDGING_HEADER" 2>/dev/null || \
               grep -q "#include.*<$header>" "$BRIDGING_HEADER" 2>/dev/null; then
              echo "❌ ERROR: macOS-only header: $header"
              FOUND_BAD=1
            fi
          done

          # Check new-stage imports are present
          for req in "Exploit/ANEDirectIn.h" "Exploit/IOGPU64788Controller.h" "Exploit/P062StaleEntryOracle.h"; do
            if ! grep -q "#import \"$req\"" "$BRIDGING_HEADER"; then
              echo "❌ ERROR: bridging header missing #import \"$req\""
              FOUND_BAD=1
            fi
          done

          if [ $FOUND_BAD -eq 1 ]; then
            echo ""
            echo "📝 Fix bridging header before building"
            exit 1
          fi

          echo "✓ Bridging header validation passed"

      # ============================================
      # 2. Source Files Verification
      # ============================================
      - name: Verify Source Files
        run: |
          echo "=== Verifying Source Files ==="

          required_files=(
            "Exploit/P044ExploitController.m"
            "Exploit/ANE254InputController.m"
            "Exploit/ANE254InputController.h"
            "Exploit/Lum1naKRW.m"
            "Exploit/Lum1naKRW.h"
            "Exploit/AKSExploitController.m"
            "Exploit/P051APFSXattr.m"
            "Exploit/P054APFSReapList.m"
            "Exploit/LabRuntimeOffsets.m"
            "Exploit/LabDeviceProfile.m"
            "Exploit/A14_23F77_LabOffsets.h"
            "UI/LabOffsets.swift"
            "App/ContentView.swift"
            "UI/Lum1naViewModel.swift"
            "Exploit/Bridges/ExploitManager.swift"
            "Exploit/ANEDirectIn.h"
            "Exploit/ANEDirectIn.m"
            "Exploit/IOGPU64788Controller.h"
            "Exploit/IOGPU64788Controller.m"
            "Exploit/P062StaleEntryOracle.h"
            "Exploit/P062StaleEntryOracle.m"
            "Exploit/P06xLog.h"
            "Exploit/P06xLog.m"
          )

          MISSING=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "❌ $file MISSING"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            exit 1
          fi

          echo "✅ All source files verified"

      # ============================================
      # 3. iOS 18 Universal App Icon Verification
      # ============================================
      - name: Verify iOS 18 Universal App Icons
        run: |
          set -euo pipefail
          echo "=== Validating iOS 18 Universal App Icons ==="

          ICON_DIR="Assets.xcassets/AppIcon.appiconset"

          if [ ! -d "$ICON_DIR" ]; then
            echo "❌ ERROR: $ICON_DIR not found"
            exit 1
          fi

          if [ ! -f "$ICON_DIR/Contents.json" ]; then
            echo "❌ ERROR: Contents.json missing"
            exit 1
          fi

          REQUIRED_ICONS=(
            "AppIcon.jpg"
            "AppIcon-Dark.jpg"
            "AppIcon-Tinted.jpg"
          )

          MISSING=0
          for icon in "${REQUIRED_ICONS[@]}"; do
            if [ -f "$ICON_DIR/$icon" ]; then
              echo "✓ Found $icon"
            else
              echo "❌ Missing $icon"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "❌ iOS 18 Universal App Icon validation failed"
            exit 1
          fi

          echo "✅ App Icons validated"

      # ============================================
      # 4. Model Files Check
      # ============================================
      - name: Verify Model Files
        run: |
          echo "=== Checking Model Files ==="

          MODEL_NAME="XVRC27_254in_1out_addchain"
          MODEL_PATHS=(
            "model/${MODEL_NAME}.mlmodelc"
            "Resources/${MODEL_NAME}.mlmodelc"
          )

          FOUND=0
          for path in "${MODEL_PATHS[@]}"; do
            if [ -d "$path" ]; then
              echo "✓ Found model at: $path"
              FOUND=1
              break
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "⚠️ Model not found - build may fail"
          else
            echo "✅ Model files verified"
          fi

  # ============================================
  # Job 2: Build (only if validate passes)
  # ============================================
  build:
    runs-on: macos-15
    needs: validate
    timeout-minutes: 45
    name: "🔨 Build IPA"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode_16.4.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Remove Problematic AVE Files
        run: |
          echo "=== Removing dual-session AVERace only (P056 is the VT reach tap) ==="
          rm -f Exploit/AVERace.m Exploit/AVERace.h 2>/dev/null || true
          echo "✅ Removed AVERace"

      - name: Create Entitlements
        run: |
          cat > Lum1na.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.coreml</key>
              <true/>
              <key>com.apple.private.IOSurface</key>
              <true/>
              <key>com.apple.private.ane</key>
              <true/>
              <key>com.apple.private.ane.allow</key>
              <true/>
              <key>com.apple.security.exception.iokit-user-client-class</key>
              <array>
                  <string>AppleNeuralEngineUserClient</string>
                  <string>IOSurfaceRootUserClient</string>
                  <string>IOGPUDevice</string>
              </array>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Detect and Inject Missing Frameworks
        id: framework-injection
        run: |
          #!/bin/bash
          set -e

          echo "🔍 Detecting missing frameworks..."

          PROJECT_FILE="${PROJECT_NAME}.xcodeproj/project.pbxproj"

          declare -a REQUIRED=(
            "IOSurface"
            "IOKit"
            "CoreML"
            "Foundation"
            "UIKit"
            "CoreVideo"
            "VideoToolbox"
          )

          MISSING=()
          for fw in "${REQUIRED[@]}"; do
            if ! grep -q "${fw}.framework" "$PROJECT_FILE" 2>/dev/null; then
              MISSING+=("$fw")
              echo "  ⚠️  Missing: $fw.framework"
            fi
          done

          OTHER_LDFLAGS=""
          for fw in "${MISSING[@]}"; do
            OTHER_LDFLAGS="$OTHER_LDFLAGS -framework $fw"
          done

          echo "other_ldflags=$OTHER_LDFLAGS" >> $GITHUB_OUTPUT

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚡ Will inject: $OTHER_LDFLAGS"
          else
            echo "✅ All frameworks present"
          fi

      - name: Build Unsigned IPA
        env:
          OTHER_LDFLAGS: ${{ steps.framework-injection.outputs.other_ldflags }}
        run: |
          set -euo pipefail

          echo "=== Starting Xcode Build ==="

          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="Lum1na.entitlements" \
            SWIFT_OBJC_BRIDGING_HEADER="${PROJECT_NAME}-Bridging-Header.h" \
            IPHONEOS_DEPLOYMENT_TARGET="${DEPLOYMENT_TARGET}" \
            build

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "${PROJECT_NAME}.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "❌ ERROR: .app not found in build products"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "${PROJECT_NAME}.ipa" Payload
          ls -lh "${PROJECT_NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lum1na-IPA
          path: Lum1na.ipa
          if-no-files-found: error
          retention-days: 7
