name: bigreq model (T8150 >254-in)
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate + compile >254-in mlmodelc
        run: |
          python3 -m venv /tmp/mvenv
          /tmp/mvenv/bin/python -m pip install --quiet --upgrade pip
          /tmp/mvenv/bin/pip install --quiet coremltools numpy
          /tmp/mvenv/bin/python tools/make_big_req_model.py 257
      - uses: actions/upload-artifact@v4
        with: { name: bigreq-mlmodelc, path: "XVRC27_257in_1out_bigreq.mlmodelc/", retention-days: 1 }
