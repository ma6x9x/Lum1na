name: Lum1naRoot deb
on:
  workflow_dispatch:
  push:
    paths: ['deb/**']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Compile lum1na-fkt (root helper)
        run: |
          cp deb/lum1na-fkt.c.txt /tmp/lum1na-fkt.c
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 \
            -fobjc-arc -framework Foundation -o /tmp/lum1na-fkt \
            /tmp/lum1na-fkt.c
          ldid -S /tmp/lum1na-fkt
      - name: Compile kernproc one-shot
        run: |
          cp deb/kernproc.c.txt /tmp/kernproc.c
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 \
            -o /tmp/kernproc /tmp/kernproc.c
            # NOTE: run with slide arg on-device: /var/jb/usr/libexec/kernproc <slide>
          ldid -S /tmp/kernproc
      - uses: actions/upload-artifact@v4
        with:
          name: kernproc-oneshot
          path: /tmp/kernproc
          retention-days: 1

      - name: Assemble .deb
        run: |
          mkdir -p deb/pkg/DEBIAN deb/pkg/usr/libexec deb/pkg/usr/bin
          cp deb/Lum1naRoot/DEBIAN/control deb/pkg/DEBIAN/control
          cp deb/Lum1naRoot/DEBIAN/postinst deb/pkg/DEBIAN/postinst
          cp /tmp/lum1na-fkt deb/pkg/usr/libexec/lum1na-fkt
          cp /tmp/kernproc deb/pkg/usr/libexec/kernproc
          dpkg-deb --root-owner-group --build deb/pkg \
            com.ma6x9x.lum1naroot_0.0.1_iphoneos-arm64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: lum1naroot-deb
          path: com.ma6x9x.lum1naroot_0.0.1_iphoneos-arm64.deb
          retention-days: 1
